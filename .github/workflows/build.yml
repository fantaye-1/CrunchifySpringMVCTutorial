name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrunchifySpringMVCTutorial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: CrunchifySpringMVCTutorial/pom.xml
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: war
          path: CrunchifySpringMVCTutorial/target/*.war
